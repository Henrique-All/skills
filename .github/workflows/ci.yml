name: Skills CI

on:
  push:
    branches: [ master, main, '[0-9]+.[0-9]+*' ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Monorepo Validation Tests
        run: npm test

  security-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: DevSecOps Audit (SARIF)
        run: node devsecops-audit/scripts/audit.js . --sarif=reports/devsecops.sarif --no-npm-audit || true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/devsecops.sarif
          category: devsecops-audit
